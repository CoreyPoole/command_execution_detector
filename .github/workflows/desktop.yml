name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches: [v0-2-analysis-gui-release]
    tags: ["v*"]

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install app and packaging tool
        run: |
          python -m pip install .
          python -m pip install pyinstaller
      - name: Build native desktop app
        run: python -m PyInstaller --noconfirm --windowed --onedir --name CEDE --collect-all tree_sitter_rust scripts/cede_gui.py
      - name: Upload platform app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CEDE-${{ runner.os }}
          path: dist/CEDE*
          if-no-files-found: error
