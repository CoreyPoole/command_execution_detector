name: Python tests and package

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run labeled Rust benchmark
        run: python -m cede.benchmark

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test installed wheel
        run: |
          cd /tmp
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cede --help
          python -m cede.benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: cede-python-dist
          path: dist/*
